# ==============================================================================
# HRIS local development stack
#
# Ports are deliberately offset from the defaults (PostgreSQL 5433, Redis 6381)
# so this stack can run alongside other projects on the same machine without
# clashing. Container-to-container traffic uses the service names, never these
# published ports.
#
#   npm run infra:up      start PostgreSQL and Redis only
#   npm run stack:up      build and start the full stack (infra + API + web)
#   npm run stack:logs    tail application logs
#   npm run stack:down    stop and remove everything
#
# Copy .env.example to .env first. Secrets come from the environment or a secret
# manager in any shared environment; the defaults here are development-only.
# ==============================================================================

name: hris

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hris}
      POSTGRES_USER: ${POSTGRES_USER:-hris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: '--data-checksums --locale=C.UTF-8'
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - hris-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass is supplied from the environment. An empty password disables
    # authentication, which must never happen outside a throwaway sandbox.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        --appendonly yes
        --appendfsync everysec
        --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    security_opt:
      - no-new-privileges:true
    networks:
      - hris-network

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # Service names, not published ports: this is what the API reaches inside
      # the compose network.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-hris}
      POSTGRES_USER: ${POSTGRES_USER:-hris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      # The browser reaches the API through the published host port, so CORS must
      # allow the host-side origin rather than the internal compose hostname.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Must be a concrete interface. The wildcard is required so sibling
      # containers can reach the API, and it is not read from the host .env so a
      # developer restricting local development to 127.0.0.1 cannot accidentally
      # make the container unreachable from the web service.
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Drops the cached host lookups. The API performs no outbound HTTP in phase 0,
    # but IAM and notification providers will, and a static resolver in a
    # container silently breaks when those endpoints are added.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    networks:
      - hris-network

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
      args:
        # Inlined into the client bundle at build time, so they must be supplied
        # here rather than as runtime environment variables.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_API_PLATFORM_URL: ${NEXT_PUBLIC_API_PLATFORM_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: 3000
      # Next standalone reads PORT; keep WEB_PORT as the documented name.
      PORT: '3000'
      # Docker sets HOSTNAME to the container ID, and Next's standalone server
      # binds to whatever HOSTNAME contains. Without this override it listens only
      # on the container's own address, so the in-container health check on
      # 127.0.0.1 is refused even though the published port works.
      HOSTNAME: 0.0.0.0
      # Resolved at runtime for server-side rendering. The browser reaches the API
      # through the published host port, but the server reaches it over the private
      # network by service name, so these must differ from the NEXT_PUBLIC_ values.
      API_BASE_URL: http://api:3001/api/v1
      API_PLATFORM_URL: http://api:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - hris-network

volumes:
  postgres-data:
  redis-data:

networks:
  hris-network:
    name: hris-network
    driver: bridge
